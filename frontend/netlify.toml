# ==============================================================================
# Netlify Configuration (Subdirectory fallback if Base Directory is set to frontend)
# ==============================================================================

[build]
  publish = ".next"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"
  SECRETS_SCAN_OMIT_KEYS = "GROQ_API_KEY,HINDSIGHT_API_KEY"
  SECRETS_SCAN_OMIT_PATHS = "backend/**,docs/**,.kilo/**"

[[plugins]]
  package = "@netlify/plugin-nextjs"
